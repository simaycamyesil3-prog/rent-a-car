{% extends 'base.html' %}

{% block title %}Kayıt Ol{% endblock %}

{% block content %}
<div style="max-width:480px; margin:3rem auto;">
    <h2 class="mb-4">Hesap Oluştur</h2>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
            <label>Ad</label>
            <input type="text" name="first_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Soyad</label>
            <input type="text" name="last_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>E-posta</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Telefon</label>
            <input type="text" name="phone_number" class="form-control">
        </div>
        <div class="form-group">
            <label>Adres</label>
            <input type="text" name="address" class="form-control">
        </div>
        <div class="form-group">
            <label>Kimlik No</label>
            <input type="text" name="identity_number" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Ehliyet No</label>
            <input type="text" name="license_number" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Şifre (Tekrar)</label>
            <input type="password" name="password2" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Kayıt Ol</button>
    </form>

    <p class="mt-3">Zaten hesabın var mı? <a href="{% url 'login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Giriş Yap</a></p>
</div>
{% endblock %}
